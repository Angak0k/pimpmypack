name: "User Registration and Authentication Flow"
base_url: "http://localhost:8080/api"
scenarios:
  - name: "Register new user with unique credentials"
    request:
      method: POST
      endpoint: "/register"
      body:
        username: "test_api_{{timestamp}}"
        email: "test_{{timestamp}}@example.com"
        password: "TestPass123!"
        firstname: "Test"
        lastname: "User"
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: "$.message"
        exists: true
    store:
      username: "{{request.body.username}}"
      email: "{{request.body.email}}"
      password: "{{request.body.password}}"

  - name: "Confirm email using LOCAL mode simplified endpoint"
    request:
      method: GET
      endpoint: "/confirmemail?username={{username}}&email={{email}}"
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: "$.message"
        contains: "confirmed"

  - name: "Login with confirmed user credentials"
    request:
      method: POST
      endpoint: "/login"
      body:
        username: "{{username}}"
        password: "{{password}}"
        remember_me: false
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: "$.access_token"
        exists: true
      - type: json_path
        path: "$.refresh_token"
        exists: true
      - type: json_path
        path: "$.token"
        exists: true
    store:
      access_token: "{{response.access_token}}"
      refresh_token: "{{response.refresh_token}}"

  - name: "Get authenticated user account information"
    request:
      method: GET
      endpoint: "/v1/myaccount"
      headers:
        Authorization: "Bearer {{access_token}}"
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: "$.username"
        equals: "{{username}}"
      - type: json_path
        path: "$.email"
        equals: "{{email}}"
      - type: json_path
        path: "$.status"
        equals: "active"
    store:
      user_id: "{{response.id}}"
      user_role: "{{response.role}}"
      user_status: "{{response.status}}"

  - name: "Update user account details"
    request:
      method: PUT
      endpoint: "/v1/myaccount"
      headers:
        Authorization: "Bearer {{access_token}}"
      body:
        email: "{{email}}"
        firstname: "Updated"
        lastname: "TestUser"
        preferred_unit_system: "metric"
        preferred_currency: "EUR"
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: "$.firstname"
        equals: "Updated"
      - type: json_path
        path: "$.preferred_currency"
        equals: "EUR"
      - type: json_path
        path: "$.role"
        equals: "{{user_role}}"
      - type: json_path
        path: "$.status"
        equals: "{{user_status}}"

  - name: "SECURITY: Attempt privilege escalation (should be blocked)"
    request:
      method: PUT
      endpoint: "/v1/myaccount"
      headers:
        Authorization: "Bearer {{access_token}}"
      body:
        email: "{{email}}"
        firstname: "Hacker"
        lastname: "Attempt"
        role: "admin"
        status: "revoked"
        preferred_unit_system: "metric"
        preferred_currency: "USD"
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: "$.firstname"
        equals: "Hacker"
      - type: json_path
        path: "$.role"
        equals: "standard"
      - type: json_path
        path: "$.status"
        equals: "active"

  - name: "Change user password"
    request:
      method: PUT
      endpoint: "/v1/mypassword"
      headers:
        Authorization: "Bearer {{access_token}}"
      body:
        current_password: "{{password}}"
        new_password: "NewTestPass456!"
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: "$.message"
        exists: true
    store:
      password: "NewTestPass456!"

  - name: "SECURITY: Refresh token from before the password change is revoked"
    request:
      method: POST
      endpoint: "/auth/refresh"
      body:
        refresh_token: "{{refresh_token}}"
    assertions:
      - type: status_code
        expected: 401

  - name: "Login with new password to verify change"
    request:
      method: POST
      endpoint: "/login"
      body:
        username: "{{username}}"
        password: "{{password}}"
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: "$.access_token"
        exists: true
      - type: json_path
        path: "$.refresh_token"
        exists: true
    store:
      new_access_token: "{{response.access_token}}"
      refresh_token: "{{response.refresh_token}}"

  - name: "Refresh access token using refresh token"
    request:
      method: POST
      endpoint: "/auth/refresh"
      body:
        refresh_token: "{{refresh_token}}"
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: "$.access_token"
        exists: true
      - type: json_path
        path: "$.expires_in"
        exists: true
      - type: json_path
        path: "$.refresh_token"
        exists: true
    store:
      refreshed_access_token: "{{response.access_token}}"
      rotated_refresh_token: "{{response.refresh_token}}"

  - name: "Verify refreshed access token works"
    request:
      method: GET
      endpoint: "/v1/myaccount"
      headers:
        Authorization: "Bearer {{refreshed_access_token}}"
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: "$.username"
        equals: "{{username}}"

  - name: "SECURITY: Token in query string is not accepted"
    request:
      method: GET
      endpoint: "/v1/myaccount?token={{refreshed_access_token}}"
    assertions:
      - type: status_code
        expected: 401

  - name: "Logout revokes the presented refresh token"
    request:
      method: POST
      endpoint: "/auth/logout"
      body:
        refresh_token: "{{refresh_token}}"
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: "$.message"
        contains: "Logged out"

  - name: "Refresh with a logged-out token is rejected"
    request:
      method: POST
      endpoint: "/auth/refresh"
      body:
        refresh_token: "{{refresh_token}}"
    assertions:
      - type: status_code
        expected: 401

  - name: "Logout with an unknown token still returns 200 (no enumeration)"
    request:
      method: POST
      endpoint: "/auth/logout"
      body:
        refresh_token: "unknown-token-{{timestamp}}"
    assertions:
      - type: status_code
        expected: 200

  - name: "Rotated refresh token from the earlier refresh still works"
    request:
      method: POST
      endpoint: "/auth/refresh"
      body:
        refresh_token: "{{rotated_refresh_token}}"
    assertions:
      - type: status_code
        expected: 200

  - name: "Test login with remember_me flag"
    request:
      method: POST
      endpoint: "/login"
      body:
        username: "{{username}}"
        password: "{{password}}"
        remember_me: true
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: "$.access_token"
        exists: true
      - type: json_path
        path: "$.refresh_token"
        exists: true
    store:
      rm_access_token: "{{response.access_token}}"
      rm_refresh_token: "{{response.refresh_token}}"

  - name: "Logout from all devices revokes every session"
    request:
      method: POST
      endpoint: "/v1/auth/logout-all"
      headers:
        Authorization: "Bearer {{rm_access_token}}"
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: "$.message"
        contains: "all devices"
      - type: json_path
        path: "$.revoked_sessions"
        exists: true

  - name: "Refresh after logout-all is rejected"
    request:
      method: POST
      endpoint: "/auth/refresh"
      body:
        refresh_token: "{{rm_refresh_token}}"
    assertions:
      - type: status_code
        expected: 401
